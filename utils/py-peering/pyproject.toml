[project]
name = "peering"
version = "0.2.0"
description = "PEERING Client Python Library and Tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyroute2>=0.9.5",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
measure-latency = "peering.latency:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peering"]
